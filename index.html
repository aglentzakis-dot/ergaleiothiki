<style>

*{box-sizing:border-box}[hidden]{display:none!important}.row>input,.row>.fld{min-width:0}html,body{margin:0}

.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 2px;border-bottom:1px solid var(--line)}.kv:last-child{border-bottom:0}

.cam{position:relative;width:100%;aspect-ratio:3/4;max-height:62vh;background:#000;border-radius:16px;overflow:hidden}

.bar{position:relative;height:70px;margin:10px 0;border-radius:35px;background:linear-gradient(#E9F9C9,#A9DD66);border:6px solid var(--silver);overflow:hidden}
.bar .bub{position:absolute;top:50%;width:70px;height:40px;border-radius:20px;background:radial-gradient(circle at 40% 35%,#fff,#E5F4CF 60%,#C5E39B);transform:translate(-50%,-50%);left:50%;border:2px solid #fff}
.bar .m{position:absolute;top:0;bottom:0;width:3px;background:#2E5A1C88}
.level-ok{color:var(--green)!important}
.rulerwrap{position:relative;height:60vh;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);touch-action:none}
.rulerwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.calcard{width:85.6mm;height:54mm;border:2px dashed var(--blue);border-radius:3mm;margin:10px auto;display:flex;align-items:center;justify-content:center;color:var(--blue);font-weight:800;text-align:center;font-size:13px;padding:8px}
.meter{height:16px;border-radius:9px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#2E7D5B,#F2B632,#C8412B);border-radius:9px;transition:width .15s}
canvas.graph{width:100%;height:150px;background:var(--paper);border-radius:12px;display:block}
.compass{position:relative;width:min(80vw,300px);aspect-ratio:1;margin:8px auto}
.compass svg{width:100%;height:100%}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 5px;text-align:left}.tbl th{color:var(--muted);font-size:12.5px}
.chip{display:inline-block;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:5px 11px;margin:3px 4px 3px 0;font-size:13px;font-weight:700}
.efm-slot{margin:6px 0 12px}
#arOverlay{position:fixed;inset:0;display:none;color:#fff;font-family:system-ui;z-index:50}

#arOverlay .read{background:#000b;border-radius:14px;padding:10px 14px;font-size:15px;font-weight:700}
#arOverlay .read big{font-size:30px;font-weight:900;display:block;line-height:1.15}
#arOverlay .read .step{display:inline-block;background:#FDD117;color:#17324D;border-radius:8px;padding:1px 8px;font-size:12.5px;font-weight:900;margin-bottom:4px}
#arOverlay .aseg{display:flex;gap:4px;background:#000b;border-radius:12px;padding:4px;margin-top:8px;width:max-content}
#arOverlay .aseg button{border:0;border-radius:9px;padding:7px 14px;font-weight:800;font-size:14px;background:none;color:#fff}
#arOverlay .aseg button.on{background:#FDD117;color:#17324D}
#arOverlay .hist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#arOverlay .hist span{background:#000b;border-radius:10px;padding:5px 10px;font-weight:800;font-size:14px}
#arOverlay .bot{position:absolute;left:0;right:0;bottom:calc(118px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px;align-items:flex-end}

.hrow{display:flex;gap:8px;align-items:center;margin:2px 0 12px}.hrow .search{flex:1;margin:0;min-width:0}.hrow .search input{min-width:0;width:100%}.hrow .btn{flex:none}
.robar{background:#FFF4D6;color:#5B4300;border:1px solid #F2D27A;border-radius:12px;padding:10px 12px;font-size:13.5px;margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.mv{display:flex;gap:4px;flex:none}.mv button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:9px;width:38px;height:34px;font-size:15px}.mv button:disabled{opacity:.3}
.grid.one{grid-template-columns:1fr;gap:6px}.tile.ro{padding:6px 8px;min-height:52px}.tile.ro .ic{width:36px;height:36px;font-size:20px}.tile.ro .tt{flex:1;min-width:0}.tile.ro .tt b{font-size:13.5px}

.mybtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:10px 12px;margin:0 0 12px;font-size:20px;color:var(--ink)}
.mybtn .mt{flex:1;min-width:0;font-size:15px}.mybtn small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{font-weight:500;font-size:11.5px;color:var(--muted)}
.disc{font-size:12.5px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:0 0 12px;line-height:1.45}
#gate{position:fixed;inset:0;z-index:60;background:#0b1622e6;display:flex;align-items:center;justify-content:center;padding:14px;padding-top:calc(14px + env(safe-area-inset-top));overflow:auto}

#gate .ghead{display:flex;align-items:center;gap:10px;margin-bottom:10px}#gate .ghead img{width:40px;height:40px;border-radius:10px}#gate .ghead b{flex:1;font-size:17px}

#gate .gck{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--accent);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14px;font-weight:650}
.btn:disabled{opacity:.4;cursor:not-allowed}

.footer a{color:inherit}
.footer{color:var(--muted);font-size:12px;text-align:center;margin:18px 0 4px}
</style>
</head>

  <img class="mark" src="icon-192.png" alt="" aria-hidden="true">
  <div class="htitle"><h1 id="appTitle">Εργαλειοθήκη</h1><small>GlenApps · για μάστορες</small></div>
  <button class="hbtn" data-act="lang" id="langBtn" aria-label="Γλώσσα"></button><button class="hbtn" data-act="settings" aria-label="Ρυθμίσεις">⚙️</button>
</header>
<main id="main"></main>
<nav class="bottom" id="nav">

/* ---- Αλφάδι ---- */
TOOLFN.alfadi=async function(){const go=async()=>{await motionPermission();let mode=S.settings.lvlMode||"surf",unit=S.settings.lvlUnit||"deg",hold=false,lastOk=0,cr={rawx:0,rawy:0,rawr:0};
 body(`<div class="seg" id="mSeg"><button data-m="surf">Επιφάνεια</button><button data-m="bar">Ράβδος</button></div>
 <div id="lvlBox"></div><div class="big" id="lv">—</div><div class="note" style="text-align:center" id="lv2"></div>
 <div class="seg" id="uSeg"><button data-u="deg">μοίρες °</button><button data-u="pct">κλίση %</button><button data-u="mm">mm/m</button></div>
 <div class="row"><button class="btn ghost" id="zero">⊙ Μηδένισε</button><button class="btn ghost" id="hold">⏸ Κράτα</button><button class="btn ghost" id="sv">📒</button></div>
 <p class="note" id="zinfo"></p>`);
 const paintSeg=()=>{$$("#mSeg button").forEach(b=>b.classList.toggle("on",b.dataset.m===mode));$$("#uSeg button").forEach(b=>b.classList.toggle("on",b.dataset.u===unit));
  $("#lvlBox").innerHTML=mode==="surf"?`<div class="lvl"><div class="ring" style="width:56px;height:56px"></div><div class="ring" style="width:45%;height:45%"></div><div class="ring" style="width:80%;height:80%"></div><div class="bub" id="bub"></div></div>`:`<div class="bar"><div class="m" style="left:calc(50% - 40px)"></div><div class="m" style="left:calc(50% + 37px)"></div><div class="bub" id="bub"></div></div>`;
  const z=S.settings.levelZero;$("#zinfo").textContent=(z.x||z.y||z.r)?"Διόρθωση μηδενός ενεργή. Πάτα παρατεταμένα «Μηδένισε» για επαναφορά.":""};
 paintSeg();$("#mSeg").onclick=e=>{const b=e.target.closest("button");if(!b)return;mode=b.dataset.m;S.settings.lvlMode=mode;write();paintSeg()};
 $("#uSeg").onclick=e=>{const b=e.target.closest("button");if(!b)return;unit=b.dataset.u;S.settings.lvlUnit=unit;write();paintSeg()};
 const fmt=a=>unit==="deg"?nf(a,1)+"°":unit==="pct"?nf(Math.tan(a*DEG)*100,1)+"%":nf(Math.tan(a*DEG)*1000,0)+" mm/m";
 let zeroPend=null;
 $("#zero").onclick=()=>{const z=S.settings.levelZero;if(zeroPend&&Date.now()-zeroPend.t<60000){z.x=(zeroPend.x+cr.rawx)/2;z.y=(zeroPend.y+cr.rawy)/2;z.r=(zeroPend.r+cr.rawr)/2;zeroPend=null;toast("✓ Διπλή βαθμονόμηση ολοκληρώθηκε.")}else{z.x=cr.rawx;z.y=cr.rawy;z.r=cr.rawr;zeroPend={t:Date.now(),x:cr.rawx,y:cr.rawy,r:cr.rawr};toast("✓ Μηδενίστηκε. (Για διπλή: γύρνα 180° και ξαναπάτα.)")}write();paintSeg()};
 let lp;$("#zero").addEventListener("pointerdown",()=>{lp=setTimeout(()=>{S.settings.levelZero={x:0,y:0,r:0};write();paintSeg();toast("Η διόρθωση μηδενός σβήστηκε.")},900)});$("#zero").addEventListener("pointerup",()=>clearTimeout(lp));
 $("#hold").onclick=()=>{hold=!hold;$("#hold").textContent=hold?"▶ Συνέχεια":"⏸ Κράτα"};
 $("#sv").onclick=()=>saveMeasure("alfadi","Αλφάδι",$("#lv").textContent+" ("+(mode==="surf"?"επιφάνεια":"ράβδος")+")\n"+$("#lv2").textContent);
 let got=false;setTimeout(()=>{if(!got)$("#lv2").textContent="Δεν λαμβάνονται τιμές από τον αισθητήρα. Άνοιξε την εφαρμογή από κινητό."},2500);
 gravity(g=>{got=true;if(hold)return;const z=S.settings.levelZero;
  const rawx=Math.atan2(g.x,Math.hypot(g.y,g.z))/DEG,rawy=Math.atan2(g.y,Math.hypot(g.x,g.z))/DEG;let rawr=Math.atan2(g.x,g.y)/DEG;cr={rawx,rawy,rawr};
  const ok=(a)=>Math.abs(a)<.25;
  if(mode==="surf"){const x=rawx-z.x,y=rawy-z.y,tot=Math.hypot(x,y),R=($(".lvl")||{}).clientWidth/2-30||120,k=Math.min(1,tot/10),ang=Math.atan2(y,x);
   const b=$("#bub");if(b)b.style.transform=`translate(calc(-50% + ${Math.cos(ang)*k*R}px),calc(-50% + ${-Math.sin(ang)*k*R}px))`;
   $("#lv").textContent=fmt(tot);$("#lv").classList.toggle("level-ok",ok(tot));$("#lv2").textContent=`Χ ${nf(x,1)}° · Υ ${nf(-y,1)}°`;if(ok(tot)&&Date.now()-lastOk>1500){lastOk=Date.now();beep(1200,60);buzz(30)}}
  else{let r=rawr-z.r;let near=Math.round(r/90)*90,dev=r-near;if(Math.abs(g.z)>8){$("#lv2").textContent="Σήκωσε το κινητό όρθιο ή ακούμπησέ το στο πλάι του.";}
   else $("#lv2").textContent=(Math.abs(near)%180===0?"Κατακόρυφο (στάθμη)":"Οριζόντιο")+" · απόκλιση";
   const b=$("#bub");if(b){const W=b.parentElement.clientWidth/2-40;b.style.left=`calc(50% + ${Math.max(-1,Math.min(1,-dev/10))*W}px)`}
   $("#lv").textContent=fmt(Math.abs(dev));$("#lv").classList.toggle("level-ok",ok(dev));if(ok(dev)&&Date.now()-lastOk>1500){lastOk=Date.now();beep(1200,60);buzz(30)}}})};
 startBtn("Άνοιγμα αλφαδιού",go)};
/* ---- Χάρακας / παχύμετρο ---- */
TOOLFN.xarakas=function(){const ppm=S.settings.pxPerMm;if(!ppm)return calibRuler();let inch=S.settings.rulerIn||false,a=40,b=140;
 body(`<div class="seg" id="ru"><button data-u="mm">εκ. / χιλ.</button><button data-u="in">ίντσες</button></div><div class="rulerwrap" id="rw"><canvas id="rc"></canvas></div><div class="mid" id="rd" style="margin:10px 0">—</div><div class="row"><button class="btn ghost small" id="cal">⚙️ Ξανά βαθμονόμηση</button><button class="btn ghost small" id="sv">📒 Αποθήκευση</button></div>`);
 const cv=$("#rc"),rw=$("#rw");let drag=null;
 const draw=()=>{const dpr=devicePixelRatio||1,W=rw.clientWidth,H=rw.clientHeight;cv.width=W*dpr;cv.height=H*dpr;const x=cv.getContext("2d");x.scale(dpr,dpr);x.clearRect(0,0,W,H);
  const cs=getComputedStyle(document.documentElement),ink=cs.getPropertyValue("--ink").trim();x.strokeStyle=ink;x.fillStyle=ink;x.font="700 12px system-ui";x.lineWidth=1;
  const pu=inch?ppm*25.4/16:ppm;const n=Math.floor(H/pu);for(let i=0;i<=n;i++){const y=i*pu+.5;let L=10;if(inch){L=i%16===0?34:i%8===0?24:i%4===0?17:i%2===0?12:8}else{L=i%10===0?34:i%5===0?22:12}x.beginPath();x.moveTo(0,y);x.lineTo(L,y);x.stroke();
   if(inch?i%16===0:i%10===0){x.save();x.translate(40,y+4);x.fillText(String(inch?i/16:i/10),0,0);x.restore()}}
  x.fillStyle="#F2B63255";x.fillRect(0,Math.min(a,b),W,Math.abs(b-a));x.fillStyle="#F2B632";x.fillRect(0,a-1.5,W,3);x.fillRect(0,b-1.5,W,3);
  [a,b].forEach(y=>{x.beginPath();x.arc(W-30,y,13,0,7);x.fill()});
  const mm=Math.abs(b-a)/ppm;$("#rd").textContent=inch?nf(mm/25.4,3)+"″ ("+toFrac(mm/25.4)+"″)":nf(mm,1)+" χιλ. · "+nf(mm/10,2)+" εκ."};
 const pos=e=>{const r=rw.getBoundingClientRect();return e.clientY-r.top};
 rw.addEventListener("pointerdown",e=>{const y=pos(e);drag=Math.abs(y-a)<Math.abs(y-b)?"a":"b";rw.setPointerCapture(e.pointerId);move(e)});
 const move=e=>{if(!drag)return;const y=Math.max(0,Math.min(rw.clientHeight,pos(e)));drag==="a"?a=y:b=y;draw()};rw.addEventListener("pointermove",move);rw.addEventListener("pointerup",()=>drag=null);
 const paint=()=>$$("#ru button").forEach(x=>x.classList.toggle("on",(x.dataset.u==="in")===inch));paint();
 $("#ru").onclick=e=>{const bb=e.target.closest("button");if(!bb)return;inch=bb.dataset.u==="in";S.settings.rulerIn=inch;write();paint();draw()};
 $("#cal").onclick=calibRuler;$("#sv").onclick=()=>saveMeasure("xarakas","Χάρακας",$("#rd").textContent);
 requestAnimationFrame(draw);listen(window,"resize",draw)};
function calibRuler(){let ppm=S.settings.pxPerMm||(160/25.4);body(`<div class="card"><h3>Βαθμονόμηση χάρακα</h3><p class="note">Ακούμπησε μια κάρτα <b>όρθια</b> (τραπεζική, ταυτότητα, κάρτα μέλους — όλες έχουν 85,6 × 54 χιλ.) πάνω στην οθόνη και άλλαξε το μέγεθος μέχρι το πλαίσιο να ταιριάζει ακριβώς με την κάρτα.</p>
 <div id="cc" style="border:2.5px dashed var(--blue);border-radius:10px;margin:14px auto;display:flex;align-items:center;justify-content:center;color:var(--blue);font-weight:800">κάρτα</div>
 <input type="range" id="cr" min="2" max="20" step="0.01" value="${ppm}" style="width:100%"><div class="row" style="margin-top:8px"><button class="btn ghost" id="m">−</button><button class="btn ghost" id="p">+</button></div><button class="btn amber wide" style="margin-top:12px" id="ok">✓ Ταιριάζει</button></div>`);
 const set=()=>{const c=$("#cc");c.style.width=53.98*ppm+"px";c.style.height=85.6*ppm+"px";$("#cr").value=ppm};set();
 $("#cr").oninput=e=>{ppm=+e.target.value;set()};$("#m").onclick=()=>{ppm-=.02;set()};$("#p").onclick=()=>{ppm+=.02;set()};
 $("#ok").onclick=()=>{S.settings.pxPerMm=ppm;changed();toast("✓ Ο χάρακας βαθμονομήθηκε.");TOOLFN.xarakas()}}
function toFrac(inch){const w=Math.floor(inch);let n=Math.round((inch-w)*16),d=16;if(n===16)return String(w+1);while(n&&n%2===0&&d>1){n/=2;d/=2}return(w?w+(n?" ":""):"")+(n?n+"/"+d:w?"":"0")}
/* ---- Λέιζερ & γωνία ---- */
TOOLFN.laser=function(){const go=async()=>{await motionPermission();body(`<div class="cam" id="cam"><video id="v"></video><canvas class="ov" id="ov"></canvas><div class="hud"><span class="pill" id="ang">—</span><span class="pill" id="angAB" hidden></span></div></div>
 <div class="row" style="margin-top:10px"><button class="btn ghost" id="pa">Σημείο Α</button><button class="btn ghost" id="pb" disabled>Σημείο Β</button><button class="btn ghost" id="sv">📒</button></div><p class="note">Κράτα το κινητό όρθιο. Η κίτρινη γραμμή είναι πάντα οριζόντια, η μπλε πάντα κατακόρυφη.</p>`);
 try{await camera($("#v"))}catch(e){return camError($("#cam"),e)}keepAwake();let roll=0,pitch=0,A=null,txt="";const ov=$("#ov");
 gravity(g=>{roll=Math.atan2(g.x,g.y)/DEG;pitch=Math.atan2(g.z,Math.hypot(g.x,g.y))/DEG});
 const loop=()=>{if(cur!=="laser")return;const dpr=devicePixelRatio||1,W=ov.clientWidth,H=ov.clientHeight;ov.width=W*dpr;ov.height=H*dpr;const x=ov.getContext("2d");x.scale(dpr,dpr);x.translate(W/2,H/2);x.rotate(roll*DEG);
  const ok=Math.abs(((roll%90)+90)%90)<.3||Math.abs(((roll%90)+90)%90-90)<.3;x.lineWidth=3;x.strokeStyle=ok?"#5BE37A":"#FDD117";x.shadowColor="#000";x.shadowBlur=4;x.beginPath();x.moveTo(-W*2,0);x.lineTo(W*2,0);x.stroke();
  x.strokeStyle="#5AB0FF";x.lineWidth=2;x.beginPath();x.moveTo(0,-H*2);x.lineTo(0,H*2);x.stroke();
  const r=-roll;txt="Κλίση κινητού "+nf(Math.abs(((r+45)%90+90)%90-45),1)+"°";$("#ang").textContent=txt;requestAnimationFrame(loop)};loop();
 $("#pa").onclick=()=>{A=roll;$("#pb").disabled=false;toast("Τώρα στόχευσε τη δεύτερη ευθεία και πάτα «Σημείο Β».")};
 $("#pb").onclick=()=>{let d=Math.abs(roll-A)%360;if(d>180)d=360-d;$("#angAB").hidden=false;$("#angAB").textContent="Γωνία "+nf(d,1)+"° (συμπλ. "+nf(180-d,1)+"°)";beep()};
 $("#sv").onclick=()=>saveMeasure("laser","Γωνία",($("#angAB").hidden?txt:$("#angAB").textContent))};startBtn("Άνοιγμα κάμερας",go)};
/* ---- Απόσταση & ύψος ---- */
TOOLFN.apostasi=function(){const go=async()=>{await motionPermission();let h=S.settings.phoneH||150,beta=null,dist=null;
 body(`<div class="cam" id="cam"><video id="v"></video><svg class="cross" viewBox="0 0 64 64"><circle cx="32" cy="32" r="14" fill="none" stroke="#FDD117" stroke-width="3"/><path d="M32 0v22M32 42v22M0 32h22M42 32h22" stroke="#FDD117" stroke-width="3"/></svg><div class="hud"><span class="pill" id="d1">Απόσταση —</span><span class="pill" id="d2">Ύψος —</span></div></div>
 <label class="fld" style="margin-top:10px">Ύψος κινητού από το έδαφος<span class="in"><input type="number" id="ph" value="${h}" inputmode="decimal"><span class="u">εκ.</span></span></label>
 <div class="row" style="margin-top:10px"><button class="btn amber" id="b1">⬇ Βάση</button><button class="btn" id="b2" disabled>⬆ Κορυφή</button><button class="btn ghost" id="sv">📒</button></div><p class="note" id="live"></p>`);
 try{await camera($("#v"))}catch(e){return camError($("#cam"),e)}keepAwake();
 $("#ph").oninput=e=>{h=+e.target.value||150;S.settings.phoneH=h;write()};
 gravity(g=>{beta=Math.atan2(Math.hypot(g.x,g.y),g.z)/DEG;$("#live").textContent="Γωνία από την κατακόρυφο: "+nf(beta,1)+"°"});
 $("#b1").onclick=()=>{if(beta==null)return;const below=90-beta;if(below<=0.5){toast("Στόχευσε πιο χαμηλά — στη βάση του αντικειμένου.");return}dist=h/100/Math.tan(below*DEG);$("#d1").textContent="Απόσταση "+nf(dist,2)+" m";$("#b2").disabled=false;beep()};
 $("#b2").onclick=()=>{if(beta==null||dist==null)return;const up=beta-90;const H=h/100+dist*Math.tan(up*DEG);$("#d2").textContent="Ύψος "+nf(H,2)+" m";beep()};
 $("#sv").onclick=()=>saveMeasure("apostasi","Απόσταση/ύψος",$("#d1").textContent+"\n"+$("#d2").textContent+"\nΎψος κινητού "+h+" εκ.")};startBtn("Άνοιγμα κάμερας",go)};
/* ---- Πυξίδα & θέση ---- */
TOOLFN.pyxida=function(){const go=async()=>{await motionPermission();let head=null,pos=null;
 const ticks=[...Array(72)].map((_,i)=>{const a=i*5,L=a%30===0?14:a%10===0?9:5;return`<line x1="100" y1="10" x2="100" y2="${10+L}" stroke="currentColor" stroke-width="${a%30===0?2:1}" transform="rotate(${a} 100 100)"/>`}).join("");
 const lbl=[["Β",0],["Α",90],["Ν",180],["Δ",270]].map(([t,a])=>`<text x="100" y="40" text-anchor="middle" font-weight="900" font-size="15" fill="${t==="Β"?"#C8412B":"currentColor"}" transform="rotate(${a} 100 100)">${t}</text>`).join("");
