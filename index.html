<style>
:root{--brand:#17324D;--onbrand:#fff;--accent:#F2B632;--accent2:#FDD117;--onaccent:#17324D;--paper:#EDF1F2;--card:#fff;--ink:#17324D;--muted:#5E7185;--line:#D6DEE3;--red:#C8412B;--green:#2E7D5B;--blue:#2468B5;--silver:#C9D0D7}

:root[data-theme=dark]{--paper:#0F1B27;--card:#172636;--ink:#E8EEF3;--muted:#9AABBC;--line:#2A3D50}
*{box-sizing:border-box}[hidden]{display:none!important}.row>input{min-width:0}html,body{margin:0}
body{font-family:system-ui,Segoe UI,Roboto,Noto Sans,Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;padding-bottom:calc(70px + env(safe-area-inset-bottom))}

.mark{flex:none;width:38px;height:38px;margin-right:8px;border-radius:10px}

.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:4px 12px;margin:2px 0 12px}

/* εργαλεία με αισθητήρες */
.cam{position:relative;width:100%;aspect-ratio:3/4;max-height:62vh;background:#000;border-radius:16px;overflow:hidden}
.cam video,.cam canvas.ov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.lvl{position:relative;width:min(84vw,320px);aspect-ratio:1;margin:6px auto 10px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#E9F9C9,#B9E879 70%,#8CC44C);border:6px solid var(--silver);box-shadow:inset 0 4px 12px #0003}

.lvl .bub{position:absolute;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#E8F5D0 60%,#C9E6A0);border:2px solid #fff;box-shadow:0 2px 6px #0004;left:50%;top:50%;transform:translate(-50%,-50%)}
.bar{position:relative;height:70px;margin:10px 0;border-radius:35px;background:linear-gradient(#E9F9C9,#A9DD66);border:6px solid var(--silver);overflow:hidden}
.bar .bub{position:absolute;top:50%;width:70px;height:40px;border-radius:20px;background:radial-gradient(circle at 40% 35%,#fff,#E5F4CF 60%,#C5E39B);transform:translate(-50%,-50%);left:50%;border:2px solid #fff}
.bar .m{position:absolute;top:0;bottom:0;width:3px;background:#2E5A1C88}
.level-ok{color:var(--green)!important}
.rulerwrap{position:relative;height:60vh;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);touch-action:none}
.rulerwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.calcard{width:85.6mm;height:54mm;border:2px dashed var(--blue);border-radius:3mm;margin:10px auto;display:flex;align-items:center;justify-content:center;color:var(--blue);font-weight:800;text-align:center;font-size:13px;padding:8px}
.meter{height:16px;border-radius:9px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#2E7D5B,#F2B632,#C8412B);border-radius:9px;transition:width .15s}
canvas.graph{width:100%;height:150px;background:var(--paper);border-radius:12px;display:block}
.compass{position:relative;width:min(80vw,300px);aspect-ratio:1;margin:8px auto}
.compass svg{width:100%;height:100%}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 5px;text-align:left}.tbl th{color:var(--muted);font-size:12.5px}
.chip{display:inline-block;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:5px 11px;margin:3px 4px 3px 0;font-size:13px;font-weight:700}
.efm-slot{margin:6px 0 12px}
#arOverlay{position:fixed;inset:0;display:none;color:#fff;font-family:system-ui;z-index:50}
#arOverlay .top{position:absolute;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;align-items:flex-start}
#arOverlay .read{flex:1;background:#000a;border-radius:12px;padding:8px 12px;font-size:15px;font-weight:700}
#arOverlay .read big{font-size:26px;font-weight:900;display:block}
#arOverlay .bot{position:absolute;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:14px;align-items:center}
#arOverlay button{border:0;border-radius:50%;width:56px;height:56px;font-size:22px;background:#ffffffdd;color:#17324D;font-weight:900}
#arOverlay button.add{width:78px;height:78px;font-size:38px;background:#FDD117}
.footer{color:var(--muted);font-size:12px;text-align:center;margin:18px 0 4px}
</style>

<body>

  <img class="mark" src="icon-192.png" alt="" aria-hidden="true">

<div class="modal" id="modal"><div class="sheet" role="dialog" aria-modal="true"><div class="sh-head"><span class="t" id="shTitle"></span><button class="x" id="shClose" aria-label="Κλείσιμο">✕</button></div><div class="sh-body" id="shBody"></div></div></div>

<div class="bot"><button id="arUndo" aria-label="Αναίρεση">↶</button><button class="add" id="arAdd" aria-label="Σημείο">+</button><button id="arNew" aria-label="Νέα μέτρηση">⟲</button><button id="arClose" aria-label="Έξοδος">✕</button></div></div>

<script>
/*

"use strict";
const APP_VERSION="1.0.0",APP_BUILD="2026-10-09",APP_ID="ergaleiothiki",KEY="ergaleiothiki-v1",COPY_OWNER="Ανδρέας Μ. Γλεντζάκης",
APP_URL="https://aglentzakis-dot.github.io/ergaleiothiki/",FS_DB="shared-backups",FS_STORE="handles",FS_KEY="ergaleiothiki-root",FS_SUB="Εργαλειοθήκη",BK_PREFIX="ergaleiothiki-antigrafo";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const T=(s,v)=>{if(v)for(const k in v)s=s.split("{"+k+"}").join(v[k]);return s};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nf=(x,d=2)=>{if(x==null||!isFinite(x))return"—";return Number(x).toLocaleString("el-GR",{maximumFractionDigits:d,minimumFractionDigits:0})};
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date;return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const DEG=Math.PI/180;
/* ---------- αποθήκευση ---------- */
let S=load();
function load(){let s={};try{s=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch{}
 s.settings=Object.assign({beep:true,vib:true,pxPerMm:0,levelZero:{x:0,y:0,r:0},dbOffset:0,phoneH:150,theme:"auto",gdrive:{},bkWarned:0},s.settings||{});
 s.calc=s.calc||{};s.saved=s.saved||[];s.list=s.list||[];s.meta=Object.assign({changes:0},s.meta||{});return s}
function write(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch{toast("Δεν αποθηκεύτηκε — ο χώρος της συσκευής γέμισε.")}}
function changed(){S.meta.changes=(S.meta.changes||0)+1;S.meta.lastChange=Date.now();write();bkOnChange()}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),2600)}
function applyTheme(){const t=S.settings.theme;t==="auto"?document.documentElement.removeAttribute("data-theme"):document.documentElement.setAttribute("data-theme",t)}
applyTheme();
/* ---------- φύλλο ---------- */
function openSheet(title,html,onOpen){$("#shTitle").textContent=title;$("#shBody").innerHTML=html;$("#modal").classList.add("open");onOpen&&onOpen($("#shBody"))}
function closeSheet(){$("#modal").classList.remove("open")}
$("#shClose").onclick=closeSheet;$("#modal").addEventListener("click",e=>{e.target.id==="modal"&&closeSheet()});
/* ---------- ήχος / δόνηση ---------- */
let actx=null;function beep(f=880,ms=70,vol=.15){if(!S.settings.beep)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext);const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.value=vol;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+ms/1e3)}catch{}}
function buzz(p=40){if(S.settings.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch{}}
/* ---------- αισθητήρες ---------- */
let stopFns=[];function onStop(f){stopFns.push(f)}
function stopAll(){stopFns.forEach(f=>{try{f()}catch{}});stopFns=[]}
async function motionPermission(){try{if(typeof DeviceMotionEvent!=="undefined"&&DeviceMotionEvent.requestPermission){const r=await DeviceMotionEvent.requestPermission();if(r!=="granted")return false}if(typeof DeviceOrientationEvent!=="undefined"&&DeviceOrientationEvent.requestPermission){await DeviceOrientationEvent.requestPermission()}}catch{}return true}
function listen(target,ev,fn,opt){target.addEventListener(ev,fn,opt);onStop(()=>target.removeEventListener(ev,fn,opt))}
/* βαρύτητα με εξομάλυνση */
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function gravity(cb,k=.15){let g=null;listen(window,"devicemotion",e=>{const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;const sg=IOS?-1:1,v={x:a.x*sg,y:a.y*sg,z:a.z*sg};g=g?{x:g.x+(v.x-g.x)*k,y:g.y+(v.y-g.y)*k,z:g.z+(v.z-g.z)*k}:v;cb(g)})}
async function camera(video,opts={}){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("nocam");
 const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:opts.front?"user":{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false});
 video.srcObject=st;video.setAttribute("playsinline","");video.muted=true;await video.play().catch(()=>{});onStop(()=>st.getTracks().forEach(t=>t.stop()));return st}
function camError(el,e){el.innerHTML=`<div class="warn">📷 Δεν άνοιξε η κάμερα. Δώσε άδεια κάμερας στην εφαρμογή (πάτα το λουκέτο δίπλα στη διεύθυνση ή Ρυθμίσεις → Εφαρμογές → Chrome → Άδειες) και ξαναδοκίμασε.</div>`}
let wakeLock=null;async function keepAwake(){try{if("wakeLock"in navigator){wakeLock=await navigator.wakeLock.request("screen");onStop(()=>{try{wakeLock&&wakeLock.release()}catch{}wakeLock=null})}}catch{}}
/* ---------- αποθήκευση μέτρησης / λίστα ---------- */
function saveMeasure(tool,title,text){const name=prompt("Όνομα για τη μέτρηση (π.χ. δουλειά ή χώρος):",title||"");if(name===null)return;S.saved.unshift({id:uid(),at:Date.now(),tool,title:name||title||"Μέτρηση",text});changed();toast("✓ Αποθηκεύτηκε στις Μετρήσεις.")}
function addToList(items,from){if(!items||!items.length)return;items.forEach(i=>{const ex=S.list.find(x=>x.item===i.item&&x.unit===i.unit&&!x.done);ex?ex.qty=+(ex.qty+i.qty).toFixed(2):S.list.push({id:uid(),item:i.item,qty:+(+i.qty).toFixed(2),unit:i.unit||"",from:from||"",done:false})});changed();updCount();toast("✓ Μπήκαν στη λίστα υλικών ("+items.length+").")}
function updCount(){const n=S.list.filter(x=>!x.done).length;$("#cntList").innerHTML=n?` <span class="cnt">${n}</span>`:""}
async function shareText(title,text){try{if(navigator.share){await navigator.share({title,text});return}}catch(e){if(e&&e.name==="AbortError")return}try{await navigator.clipboard.writeText(text);toast("✓ Αντιγράφηκε — επικόλλησέ το όπου θέλεις.")}catch{prompt("Αντίγραψε:",text)}}

TOOLFN.alfadi=async function(){const go=async()=>{await motionPermission();let mode=S.settings.lvlMode||"surf",unit=S.settings.lvlUnit||"deg",hold=false,lastOk=0,cr={rawx:0,rawy:0,rawr:0};

 <div id="lvlBox"></div><div class="big" id="lv">—</div><div class="note" style="text-align:center" id="lv2"></div>

 <p class="note" id="zinfo"></p>`);
 const paintSeg=()=>{$$("#mSeg button").forEach(b=>b.classList.toggle("on",b.dataset.m===mode));$$("#uSeg button").forEach(b=>b.classList.toggle("on",b.dataset.u===unit));
  $("#lvlBox").innerHTML=mode==="surf"?`<div class="lvl"><div class="ring" style="width:56px;height:56px"></div><div class="ring" style="width:45%;height:45%"></div><div class="ring" style="width:80%;height:80%"></div><div class="bub" id="bub"></div></div>`:`<div class="bar"><div class="m" style="left:calc(50% - 40px)"></div><div class="m" style="left:calc(50% + 37px)"></div><div class="bub" id="bub"></div></div>`;
  const z=S.settings.levelZero;$("#zinfo").textContent=(z.x||z.y||z.r)?"Διόρθωση μηδενός ενεργή. Πάτα παρατεταμένα «Μηδένισε» για επαναφορά.":""};
 paintSeg();$("#mSeg").onclick=e=>{const b=e.target.closest("button");if(!b)return;mode=b.dataset.m;S.settings.lvlMode=mode;write();paintSeg()};
 $("#uSeg").onclick=e=>{const b=e.target.closest("button");if(!b)return;unit=b.dataset.u;S.settings.lvlUnit=unit;write();paintSeg()};
 const fmt=a=>unit==="deg"?nf(a,1)+"°":unit==="pct"?nf(Math.tan(a*DEG)*100,1)+"%":nf(Math.tan(a*DEG)*1000,0)+" mm/m";
 let zeroPend=null;

 let lp;$("#zero").addEventListener("pointerdown",()=>{lp=setTimeout(()=>{S.settings.levelZero={x:0,y:0,r:0};write();paintSeg();toast("Η διόρθωση μηδενός σβήστηκε.")},900)});$("#zero").addEventListener("pointerup",()=>clearTimeout(lp));

TOOLFN.xarakas=function(){const ppm=S.settings.pxPerMm;if(!ppm)return calibRuler();let inch=S.settings.rulerIn||false,a=40,b=140;
 body(`<div class="seg" id="ru"><button data-u="mm">εκ. / χιλ.</button><button data-u="in">ίντσες</button></div><div class="rulerwrap" id="rw"><canvas id="rc"></canvas></div><div class="mid" id="rd" style="margin:10px 0">—</div><div class="row"><button class="btn ghost small" id="cal">⚙️ Ξανά βαθμονόμηση</button><button class="btn ghost small" id="sv">📒 Αποθήκευση</button></div>`);
 const cv=$("#rc"),rw=$("#rw");let drag=null;
 const draw=()=>{const dpr=devicePixelRatio||1,W=rw.clientWidth,H=rw.clientHeight;cv.width=W*dpr;cv.height=H*dpr;const x=cv.getContext("2d");x.scale(dpr,dpr);x.clearRect(0,0,W,H);
  const cs=getComputedStyle(document.documentElement),ink=cs.getPropertyValue("--ink").trim();x.strokeStyle=ink;x.fillStyle=ink;x.font="700 12px system-ui";x.lineWidth=1;
  const pu=inch?ppm*25.4/16:ppm;const n=Math.floor(H/pu);for(let i=0;i<=n;i++){const y=i*pu+.5;let L=10;if(inch){L=i%16===0?34:i%8===0?24:i%4===0?17:i%2===0?12:8}else{L=i%10===0?34:i%5===0?22:12}x.beginPath();x.moveTo(0,y);x.lineTo(L,y);x.stroke();
   if(inch?i%16===0:i%10===0){x.save();x.translate(40,y+4);x.fillText(String(inch?i/16:i/10),0,0);x.restore()}}
  x.fillStyle="#F2B63255";x.fillRect(0,Math.min(a,b),W,Math.abs(b-a));x.fillStyle="#F2B632";x.fillRect(0,a-1.5,W,3);x.fillRect(0,b-1.5,W,3);
  [a,b].forEach(y=>{x.beginPath();x.arc(W-30,y,13,0,7);x.fill()});
  const mm=Math.abs(b-a)/ppm;$("#rd").textContent=inch?nf(mm/25.4,3)+"″ ("+toFrac(mm/25.4)+"″)":nf(mm,1)+" χιλ. · "+nf(mm/10,2)+" εκ."};
 const pos=e=>{const r=rw.getBoundingClientRect();return e.clientY-r.top};
 rw.addEventListener("pointerdown",e=>{const y=pos(e);drag=Math.abs(y-a)<Math.abs(y-b)?"a":"b";rw.setPointerCapture(e.pointerId);move(e)});
 const move=e=>{if(!drag)return;const y=Math.max(0,Math.min(rw.clientHeight,pos(e)));drag==="a"?a=y:b=y;draw()};rw.addEventListener("pointermove",move);rw.addEventListener("pointerup",()=>drag=null);
 const paint=()=>$$("#ru button").forEach(x=>x.classList.toggle("on",(x.dataset.u==="in")===inch));paint();
 $("#ru").onclick=e=>{const bb=e.target.closest("button");if(!bb)return;inch=bb.dataset.u==="in";S.settings.rulerIn=inch;write();paint();draw()};

TOOLFN.ixometro=function(){const go=async()=>{let st;try{st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}catch{return body(`<div class="warn">🎤 Δεν δόθηκε άδεια μικροφώνου. Ενεργοποίησέ την από τις άδειες του φυλλομετρητή και ξαναδοκίμασε.</div>`)}

 <div class="card" style="margin-top:12px"><h3>Για σύγκριση</h3><table class="tbl"><tr><td>Ήσυχο δωμάτιο</td><td>30–40 dB</td></tr><tr><td>Κουβέντα</td><td>60 dB</td></tr><tr><td>Δρόμος με κίνηση</td><td>70–80 dB</td></tr><tr><td>Δράπανο / κομπρεσέρ</td><td>85–95 dB</td></tr><tr><td>Τροχός, κομπρεσέρ αέρος, σφυρί</td><td>100–110 dB</td></tr></table><p class="note">Από 85 dB και πάνω για πολλή ώρα: ωτοασπίδες. Η μέτρηση είναι ενδεικτική.</p></div>`);
 let mn=999,mx=0,sum=0,n=0,hist=[];const lv=[[85,"⚠ φοράς ωτοασπίδες"],[70,"δυνατός θόρυβος"],[50,"συνηθισμένος"],[0,"ήσυχα"]];

function fsIdb(){return new Promise((r,j)=>{const q=indexedDB.open(FS_DB,1);q.onupgradeneeded=()=>{const d=q.result;d.objectStoreNames.contains(FS_STORE)||d.createObjectStore(FS_STORE)};q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}
async function fsIdbDo(m,f){try{const d=await fsIdb();return await new Promise((r,j)=>{const t=d.transaction(FS_STORE,m),q=f(t.objectStore(FS_STORE));q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}catch{return null}}
const fsOK=()=>typeof window.showDirectoryPicker==="function"&&window.isSecureContext;
async function fsPerm(h,ask){try{let p=await h.queryPermission({mode:"readwrite"});if(p==="granted")return true;if(!ask)return false;p=await h.requestPermission({mode:"readwrite"});return p==="granted"}catch{return false}}
async function fsRoot(ask){if(!fsOK())return null;let h=await fsIdbDo("readonly",s=>s.get(FS_KEY));if(h&&await fsPerm(h,ask))return h;if(ask!==true)return null;
 try{h=await window.showDirectoryPicker({id:"ergaleiothiki",mode:"readwrite",startIn:"downloads"})}catch{return null}if(!await fsPerm(h,true))return null;await fsIdbDo("readwrite",s=>s.put(h,FS_KEY));return h}
async function fsAppDir(ask){const r=await fsRoot(ask);if(!r)return null;const n=r.name.toLowerCase();if(/^(εργαλειοθηκη|εργαλειοθήκη|ergaleiothiki)$/.test(n))return r;
 if(/^glenapps$/.test(n))return r.getDirectoryHandle(FS_SUB,{create:true});const g=await r.getDirectoryHandle("GlenApps",{create:true});return g.getDirectoryHandle(FS_SUB,{create:true})}
async function fsBackup(ask){try{const d=await fsAppDir(ask);if(!d)return false;const fh=await d.getFileHandle(BK_PREFIX+"-"+today()+".json",{create:true}),w=await fh.createWritable();await w.write(new Blob([backupPayload()],{type:"application/json"}));await w.close();
 const all=[];for await(const[n,h]of d.entries())if(h.kind==="file"&&n.startsWith(BK_PREFIX+"-"))all.push(n);all.sort().reverse().slice(10).forEach(n=>d.removeEntry(n).catch(()=>{}));S.meta.fsLast=Date.now();write();return true}catch{return false}}
async function fsListBk(){try{const d=await fsAppDir(true);if(!d)return[];const a=[];for await(const[n,h]of d.entries())if(h.kind==="file"&&n.startsWith(BK_PREFIX+"-")){const f=await h.getFile();a.push({name:n,at:f.lastModified,h})}return a.sort((x,y)=>y.name.localeCompare(x.name)).slice(0,10)}catch{return[]}}
function downloadBackup(){const b=new Blob([backupPayload()],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=BK_PREFIX+"-"+today()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);S.meta.dlLast=Date.now();write()}
let bkT=null;function bkOnChange(){clearTimeout(bkT);bkT=setTimeout(async()=>{if(await fsRoot(false))await fsBackup(false)},2e4);try{window.GlenDrive&&GlenDrive.changed()}catch{}}
function gdInit(){try{window.GlenDrive&&GlenDrive.init({app:APP_ID,folder:FS_SUB,prefix:BK_PREFIX,payload:backupPayload,t:(s,v)=>T(s,v),toast,store:{get:()=>S.settings.gdrive||{},set:v=>{S.settings.gdrive=v;write()}},onState:()=>{$("#gdBox")&&gdPaint()}})}catch{}}
function gdPaint(){const b=$("#gdBox");if(!b||!window.GlenDrive)return;const s=GlenDrive.state();
 b.innerHTML=s.on?`<p class="note">✓ Συνδεδεμένο${s.email?" με "+esc(s.email):""}. Ανεβαίνει μόνο του μετά από κάθε αλλαγή.${s.last?"<br>Τελευταίο: "+new Date(s.last).toLocaleString("el-GR"):""}${s.err?"<br>⚠ "+esc(s.err):""}</p>${s.needTap?`<div class="warn">Πάτα «Ανέβασε τώρα» για να ξαναδοθεί πρόσβαση.</div>`:""}<div class="row"><button class="btn small" id="gdUp">☁️ Ανέβασε τώρα</button><button class="btn ghost small" id="gdRe">⤓ Επαναφορά</button>${s.folderUrl?`<a class="btn ghost small" style="text-decoration:none" href="${s.folderUrl}" target="_blank" rel="noopener">📂 Φάκελος</a>`:""}<button class="btn ghost small" id="gdOff">Αποσύνδεση</button></div>`
 :`<p class="note">Με το Google Drive τα στοιχεία σου είναι ασφαλή ακόμα κι αν χαλάσει ή χαθεί το κινητό. Μπαίνουν στον φάκελο «GlenApps › Εργαλειοθήκη» του δικού σου Drive.</p><button class="btn amber wide" id="gdOn">☁️ Σύνδεση με Google Drive</button>`;
 const on=$("#gdOn");on&&(on.onclick=async()=>{try{await GlenDrive.connect();toast("✓ Συνδέθηκε και ανέβηκε το πρώτο αντίγραφο.");gdPaint()}catch{toast("Δεν ολοκληρώθηκε η σύνδεση.")}});
 const up=$("#gdUp");up&&(up.onclick=async()=>{try{await GlenDrive.uploadNow();toast("✓ Ανέβηκε στο Google Drive.");gdPaint()}catch{toast("Δεν ανέβηκε. Έλεγξε τη σύνδεση στο διαδίκτυο.")}});
 const off=$("#gdOff");off&&(off.onclick=()=>{GlenDrive.disconnect();gdPaint()});
 const re=$("#gdRe");re&&(re.onclick=async()=>{try{const l=(await GlenDrive.list()).slice(0,10);pickRestore(l.map((f,i)=>({name:f.name,at:Date.parse(f.modifiedTime),get:()=>GlenDrive.download(f.id)})))}catch{toast("Δεν φορτώθηκαν τα αντίγραφα.")}})}
function pickRestore(arr){if(!arr.length)return toast("Δεν βρέθηκαν αντίγραφα.");openSheet("Επαναφορά αντιγράφου",`<div class="list">${arr.map((f,i)=>`<div class="it"><div class="tx"><b>${esc(f.name)}${i===0?' <span class="chip" style="padding:1px 8px">νεότερο</span>':""}</b><small>${new Date(f.at).toLocaleString("el-GR")}</small></div><button class="btn small" data-i="${i}">Επαναφορά</button></div>`).join("")}</div>`,b=>{b.querySelectorAll("[data-i]").forEach(x=>x.onclick=async()=>{try{restoreFrom(await arr[+x.dataset.i].get())}catch{toast("Δεν διαβάστηκε.")}})})}

  <div class="kv"><span>Βαθμονόμηση χάρακα</span><b><button class="btn ghost small" data-tool="xarakas" id="sCal">${st.pxPerMm?"Έγινε ✓":"Κάν' την"}</button></b></div>
  <div class="kv"><span>Μηδέν αλφαδιού</span><b><button class="btn ghost small" id="sLz">Επαναφορά</button></b></div></div>
 <div class="card"><h3>🧩 Οι εφαρμογές μας</h3><div id="efmPage"><p class="note">Φόρτωση…</p></div></div>
 <div class="card"><h3>ℹ️ Σχετικά</h3><div class="kv"><span>Έκδοση</span><b>${APP_VERSION} · ${APP_BUILD}</b></div><div class="row" style="margin-top:8px"><button class="btn ghost small" id="upd">🔄 Έλεγχος αναβάθμισης</button><button class="btn ghost small" id="terms">Όροι & απόρρητο</button></div>
  <p class="note">© 2026 ${COPY_OWNER} · GlenApps. Με την επιφύλαξη παντός δικαιώματος.</p></div>`;
 gdPaint();$("#sTh").value=st.theme||"auto";
 $("#sBeep").onchange=e=>{st.beep=e.target.checked;write()};$("#sVib").onchange=e=>{st.vib=e.target.checked;write()};$("#sTh").onchange=e=>{st.theme=e.target.value;write();applyTheme()};
 $("#sDb").oninput=e=>{st.dbOffset=+e.target.value||0;write()};$("#sLz").onclick=()=>{st.levelZero={x:0,y:0,r:0};write();toast("✓ Έγινε επαναφορά.")};
 $("#sCal").onclick=e=>{e.stopPropagation();openTool("xarakas");calibRuler()};
 const fg=$("#fsGo");fg&&(fg.onclick=async()=>{toast(await fsBackup(true)?"✓ Μπήκε αντίγραφο στον φάκελο.":"Δεν διαλέχτηκε φάκελος.");settings()});
 const fr=$("#fsRe");fr&&(fr.onclick=async()=>{const l=await fsListBk();pickRestore(l.map(f=>({name:f.name,at:f.at,get:async()=>(await f.h.getFile()).text()})))});
 $("#dl").onclick=downloadBackup;$("#ul").onchange=async e=>{const f=e.target.files[0];f&&restoreFrom(await f.text())};
 $("#upd").onclick=()=>checkUpdate(false);$("#terms").onclick=terms;

const localFile=()=>location.protocol==="file:";let lastCheck=0,newSW=null;
async function checkUpdate(quiet){if(localFile()){quiet||toast("Τρέχει ως αρχείο — ανέβασέ το στη σελίδα για αναβαθμίσεις.");return}if(quiet){if(Date.now()-lastCheck<6e4)return;lastCheck=Date.now()}quiet||toast("Έλεγχος για νεότερη έκδοση…");
 try{const t=await(await fetch(location.pathname+"?probe="+Date.now(),{cache:"no-store"})).text(),m=t.match(/<meta name="app-version" content="([^"]+)"/);if(m&&m[1]!==APP_VERSION){showUpdateBar(m[1]);return}quiet||toast("Έχεις την τελευταία έκδοση ("+APP_VERSION+").")}catch{quiet||toast("Ο έλεγχος χρειάζεται σύνδεση στο διαδίκτυο.")}}
function showUpdateBar(v){if($("#updBar"))return;const d=document.createElement("div");d.className="updbar";d.id="updBar";d.innerHTML=`<span>${v?"Βρέθηκε η έκδοση "+esc(v)+".":"Υπάρχει νεότερη έκδοση."}</span><button class="btn amber small" id="updGo">Ανανέωση τώρα</button>`;document.body.appendChild(d);$("#updGo").onclick=hardReload}
async function hardReload(){toast("Φέρνω τη νεότερη έκδοση…");try{newSW&&newSW.postMessage({type:"skipWaiting"})}catch{}try{const k=await caches.keys();await Promise.all(k.map(n=>caches.delete(n)))}catch{}try{const r=await navigator.serviceWorker.getRegistration();r&&await r.unregister()}catch{}setTimeout(()=>location.replace(location.origin+location.pathname+"?v="+Date.now()),300)}
async function initSW(){if(!("serviceWorker"in navigator)||localFile()||!window.isSecureContext)return;try{let r=await navigator.serviceWorker.getRegistration();r||(r=await navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}));r.addEventListener("updatefound",()=>{const w=r.installing;w&&w.addEventListener("statechange",()=>{w.state==="installed"&&navigator.serviceWorker.controller&&(newSW=w,showUpdateBar())})});try{r.update()}catch{}}catch{}}

{const t=new URLSearchParams(location.search).get("t");t?openTool(t,false):home()}
